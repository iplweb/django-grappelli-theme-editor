[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "django-grappelli-theme-editor"
version = "0.1.1"
description = "Database-backed theme editor for the django-grappelli admin: colours, fonts, density — site-wide and per user, with a live preview."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Michał Pasternak", email = "michal.dtz@gmail.com" },
]
keywords = ["django", "grappelli", "admin", "theme", "theme-editor", "dark-mode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=5.2",
    # Grappelli 5 is the first release that exposes its palette as CSS
    # custom properties (--grp-*); 4.x hardcodes colours in the stylesheet.
    "django-grappelli>=5.0,<6",
]

[project.optional-dependencies]
reversion = [
    "django-reversion>=5.1",
]
test = [
    "django-reversion>=5.1",
    "pytest>=8",
    "pytest-django>=4.8",
    "testcontainers[postgres]>=4",
    "psycopg[binary]>=3",
]
playwright = [
    "pytest-playwright>=0.5",
]
example = [
    "django-reversion>=5.1",
    "run-site>=0.4",
    "django-dev-helpers>=0.1.3",
    "psycopg[binary]>=3",
]

[project.urls]
Homepage = "https://github.com/iplweb/django-grappelli-theme-editor"
Repository = "https://github.com/iplweb/django-grappelli-theme-editor"
Issues = "https://github.com/iplweb/django-grappelli-theme-editor/issues"
Changelog = "https://github.com/iplweb/django-grappelli-theme-editor/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "django-grappelli-theme-editor[test,playwright,example]",
    "ruff>=0.6",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/grappelli_theme_editor",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grappelli_theme_editor"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/grappelli_theme_editor/tokens_data.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B"]
"src/grappelli_theme_editor/migrations/*.py" = ["E", "W", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = [".", "example_project"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["playwright: browser tests (need `playwright install chromium`)"]
addopts = "-m 'not playwright'"
